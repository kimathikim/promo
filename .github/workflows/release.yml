# Publishes promo-cli to PyPI when a version tag (v1.2.3) is pushed.
# One-time setup: on pypi.org add a "trusted publisher" for this repo with
# workflow `release.yml` and environment `pypi`. No API token is needed.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches promo.__version__
        run: |
          v=$(python3 -c "import ast,sys; t=ast.parse(open('promo.py').read()); print([n.value.value for n in t.body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == '__version__'][0])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != promo.__version__ $v"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
